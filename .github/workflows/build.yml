name: Build Sudan Runner APK

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      capture_screenshots:
        description: "Render gameplay screenshots (software GL, adds ~2 min)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"
  EXPORT_NAME: "Android"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validate the project: import every resource, then run the game headless
  #    for a few hundred frames while the smoke test drives the player.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate project (headless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: GDScript syntax check
        run: |
          python3 -m pip install --quiet "gdtoolkit>=4,<5"
          fail=0
          while IFS= read -r f; do
            if ! gdparse "$f"; then
              echo "::error file=$f::GDScript parse error"
              fail=1
            fi
          done < <(find scripts tools -name '*.gd' | sort)
          exit $fail

      - name: Import project (Godot 4.4 ufbx handles FBX natively)
        run: |
          # Godot 4.3+ ships the ufbx FBX importer built-in - no external
          # FBX2glTF binary is required. We run --import twice: the first
          # pass converts .fbx files to .scn/.res cache, the second ensures
          # the hero FBX and its animation clips are reachable from scripts.
          godot --headless --import 2>&1 | tail -n 40
          godot --headless --import 2>&1 | tail -n 10

      - name: Compile every script (GDScript 2 type checks)
        run: |
          # gdparse is syntax-only. This loads each script so the real compiler
          # catches base-typed property reads, uninferable `:=` and the like.
          set +e
          timeout 120 godot --headless --script tools/ci_script_check.gd 2>&1 \
            | tee scripts.log | tail -n 40
          set -e
          if ! grep -q "\[CIScripts\] OK" scripts.log; then
            grep -aE "CIScripts|Parse Error|SCRIPT ERROR" scripts.log | head -n 25 \
              | while IFS= read -r line; do echo "::error title=scripts::${line}"; done
            exit 1
          fi

      - name: Verify FBX files were imported
        run: |
          ls -la res://.godot/imported/ 2>/dev/null | grep -i "run forward\|jump\|slide\|stumble\|falling" | head -10 || true
          # Find any imported scene caches for our FBX files.
          find .godot/imported -name "*Run*Forward*.scn" -o -name "*Jump*.scn" -o -name "*Slide*.scn" 2>/dev/null | head -10 || true

      - name: Build hero scene from Arabic FBX folder (headless)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 240 godot --headless -v --script tools/ci_build_hero.gd -- --strict 2>&1 | tee hero_build.log | tail -n 120
          ls -la assets/models/hero/ 2>/dev/null || true
          echo "--- hero_report.json ---"
          cat assets/models/hero/hero_report.txt 2>/dev/null || true

      - name: Verify hero scene is drawable (strict)
        run: |
          # Guards against the v1.2.x regression where hero.tscn was saved with
          # no nodes (nodes had no owner when PackedScene.pack() ran) and the
          # runner rendered as nothing.
          echo "::group::hero_report.json"
          cat assets/models/hero/hero_report.txt 2>/dev/null || true
          echo "::endgroup::"
          set -o pipefail
          timeout 120 godot --headless --script tools/ci_verify_hero.gd -- --strict \
            2>&1 | tee hero_verify.log | tail -n 60
          grep -q "\[CIVerifyHero\] OK" hero_verify.log || {
            echo "::error::hero.tscn failed verification (see the report above)."
            exit 1
          }

      - name: Headless gameplay smoke test
        run: |
          set -o pipefail
          timeout 180 godot --headless --quit-after 1200 -- --smoke 2>&1 | tee smoke.log || true
          echo "--- errors ---"
          # Surface offending lines as check annotations: build artifacts cannot
          # be downloaded from every environment, annotations can.
          set +e
          python3 tools/ci_report_errors.py smoke.log
          report=$?
          set -e
          if [ "$report" -ne 0 ]; then
            tail -n 15 smoke.log | sed 's/^/::error::/'
            exit 1
          fi
          if ! grep -q "SMOKE_OK" smoke.log; then
            echo "::error::Smoke test did not finish (no SMOKE_OK marker)."
            tail -n 12 smoke.log | sed 's/^/::error::/'
            exit 1
          fi
          # Soak: ~100 minutes of running (≈160 km) without allocating a
          # single mesh and without the heap growing. Regression test for the
          # freeze that used to hit players after a few hundred metres.
          grep -a "SOAK" smoke.log | while IFS= read -r line; do echo "::notice title=soak::${line}"; done
          if ! grep -q "SOAK_OK" smoke.log; then
            echo "::error::Soak test failed - long runs still allocate or leak (no SOAK_OK)."
            grep -a "SOAK" smoke.log | head -n 6 | sed 's/^/::error::/'
            exit 1
          fi
          echo "Smoke + soak tests passed."

      - name: Verify streets + settings (strict)
        run: |
          # The procedural world cannot be reviewed from a diff: this builds all
          # 7 districts, checks each photographic surface has UVs and that the
          # lane-control/district settings round-trip.
          set +e
          timeout 180 godot --headless --script tools/ci_world_check.gd 2>&1 \
            | tee world_check.log | tail -n 40
          status=${PIPESTATUS[0]}
          set -e
          if ! grep -q "\[CIWorld\] OK" world_check.log; then
            # Logs live in blob storage that some environments cannot reach, so
            # every diagnostic line is re-emitted as a check annotation.
            grep -aE "\[CIWorld\]|SCRIPT ERROR|Parse Error|ERROR:" world_check.log \
              | head -n 30 | while IFS= read -r line; do echo "::error title=world_check::${line}"; done
            echo "::error::procedural streets failed validation (godot exit ${status})"
            exit 1
          fi

      - name: Probe hero animation (strict)
        run: |
          # Data checks are not enough: this instantiates the scene in a real
          # SceneTree and fails if the skeleton stays frozen (T-pose).
          set -o pipefail
          timeout 120 godot --headless --script tools/ci_hero_probe.gd -- --strict \
            2>&1 | tee hero_probe.log | tail -n 60
          grep -q "\[HeroProbe\] OK" hero_probe.log || {
            echo "::error::hero.tscn does not animate (frozen skeleton)."
            exit 1
          }

      - name: Publish hero build summary (annotations)
        if: always()
        run: |
          # Surfacing the builder log as check annotations keeps the diagnostics
          # reachable even when artifacts/log bundles are not downloadable.
          if [ -f hero_build.log ]; then
            grep -E "HeroBuilder|SCRIPT ERROR|Parse Error|ERROR:" hero_build.log \
              | tail -n 30 | while IFS= read -r line; do echo "::notice::${line}"; done
          fi
          if [ -f assets/models/hero/hero_report.txt ]; then
            tr -d '\n' < assets/models/hero/hero_report.txt | cut -c1-3000 \
              | while IFS= read -r line; do echo "::notice::hero_report ${line}"; done
          fi
          if [ -f hero_probe.log ]; then
            grep "\[HeroProbe\]" hero_probe.log | tail -n 40 \
              | while IFS= read -r line; do echo "::notice::${line}"; done
          fi

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: |
            smoke.log
            world_check.log
            hero_verify.log
            hero_probe.log
          if-no-files-found: ignore

      - name: Upload built hero + .godot cache for APK job
        uses: actions/upload-artifact@v4
        with:
          name: built-hero
          path: |
            assets/models/hero/
            .godot/
          if-no-files-found: error
          # .godot is a dot-directory: without this it is silently dropped and
          # the APK job ends up with no import cache / no script class cache
          # (that is why its verify step could not even resolve HeroBuilder).
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # 2. Export a signed (debug key) APK. Debug signing keeps the workflow usable
  #    without any repository secret; add a release keystore for store builds.
  # ---------------------------------------------------------------------------
  apk:
    name: Export APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK command line tools
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" \
            "build-tools;34.0.0" "build-tools;35.0.0" | tail -n 5
          ls "$SDK/build-tools"
          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
          } >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Download pre-built hero from validate job
        uses: actions/download-artifact@v4
        with:
          name: built-hero
          path: /tmp/built-hero
          merge-multiple: false

      - name: Restore hero scene + ufbx import cache from validate job
        run: |
          # The validate job successfully ran two --import passes and built
          # hero.tscn. Restore that .godot/imported cache so the APK job
          # doesn't have to re-invoke ufbx on a possibly-crippled fresh
          # checkout, and place the hero scene where PlayerController expects
          # it so the game loads the real mesh rather than the capsule
          # fallback.
          mkdir -p .godot assets/models/hero
          if [ -d /tmp/built-hero/.godot ]; then
            cp -a /tmp/built-hero/.godot/. .godot/
          fi
          if [ -d /tmp/built-hero/assets/models/hero ]; then
            cp -av /tmp/built-hero/assets/models/hero/. assets/models/hero/
          fi
          ls -la assets/models/hero/
          echo "=== imported cache FBX files ==="
          find .godot/imported -iname "*fbx*" 2>/dev/null | head -20
          # Verify hero.tscn exists or fail strictly.
          if [ ! -f assets/models/hero/hero.tscn ]; then
            echo "::error::validate job didn't produce hero.tscn – aborting APK export."
            exit 1
          fi

      - name: Import project (sidecars + script class cache)
        run: |
          # `.import` sidecars live next to each asset and are therefore NOT part
          # of the uploaded `.godot` cache. Without them every texture fails with
          # "No loader found for resource: res://assets/textures/flag.png", which
          # is exactly how the APK job died right after the hero started using
          # real materials. Importing is idempotent (~40 s) and also rebuilds the
          # script class cache the strict verifier needs.
          godot --headless --import 2>&1 | tail -n 20
          godot --headless --import 2>&1 | tail -n 5
          test -f .godot/global_script_class_cache.cfg || { echo "::error::script class cache missing after import"; exit 1; }
          test -f assets/textures/flag.png.import || { echo "::error::texture import sidecars missing"; exit 1; }

      - name: Verify restored hero scene (strict)
        run: |
          echo "::group::hero_report.json"
          cat assets/models/hero/hero_report.txt 2>/dev/null || true
          echo "::endgroup::"
          set -o pipefail
          timeout 120 godot --headless --script tools/ci_verify_hero.gd -- --strict \
            2>&1 | tee hero_verify_apk.log | tail -n 60
          grep -q "\[CIVerifyHero\] OK" hero_verify_apk.log || {
            echo "::error::Restored hero.tscn is not drawable – refusing to export an APK with an invisible runner."
            exit 1
          }

      - name: Publish hero diagnostics (annotations)
        if: always()
        run: |
          # Check annotations are reachable through the GitHub API even when
          # log bundles and artifacts cannot be downloaded.
          emit() { echo "::notice title=hero::$(printf '%s' "$1" | tr '\n' '|' | cut -c1-900)"; }
          emit "hero_dir: $(ls -la assets/models/hero/ 2>&1 | tr '\n' '|')"
          emit "godot_dir: $(ls .godot 2>&1 | tr '\n' ' ') user=$(whoami)"
          if [ -f assets/models/hero/hero.tscn ]; then
            emit "hero_head: $(head -c 400 assets/models/hero/hero.tscn | tr '\n' '|')"
            emit "hero_size: $(stat -c %s assets/models/hero/hero.tscn)"
            emit "hero_nodes: $(grep -c '^\[node' assets/models/hero/hero.tscn)"
          fi
          for f in hero_verify_apk.log hero_verify.log hero_probe.log; do
            if [ -f "$f" ]; then
              emit "log $f: $(tail -n 40 "$f" | tr '\n' '|')"
            fi
          done

      - name: Configure Godot for Android export
        run: |
          mkdir -p "$HOME/.config/godot"
          python3 tools/ci_configure_android.py

      - name: Restore stable signing keystore from cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ci-release.keystore
          key: android-keystore-v1-${{ github.repository }}

      - name: Create CI signing key (stable across builds)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          # The signing certificate MUST stay stable across builds, otherwise
          # Android refuses to install the new APK over the old one ("signature
          # mismatch", requires uninstall). The script generates the keystore
          # once; subsequent runs hit the actions/cache above.
          # For Play Store builds drop tools/release.keystore in the repo and
          # the script will copy that one instead.
          python3 tools/ci_gen_keystore.py
          ls -lh ci-release.keystore

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/ci-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: gadaman
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: gadaman
        run: |
          mkdir -p build
          godot --headless --export-release "$EXPORT_NAME" build/sudan-runner.apk 2>&1 | tee export.log || true
          if [ ! -f build/sudan-runner.apk ]; then
            echo "::warning::Release export failed - falling back to a debug-signed APK."
            godot --headless --export-debug "$EXPORT_NAME" build/sudan-runner.apk 2>&1 | tee -a export.log || true
          fi
          if [ ! -f build/sudan-runner.apk ]; then
            echo "::error::APK was not produced"
            # The actionable lines are the ones right after
            # "due to configuration errors:" - surface those first.
            grep -A6 "due to configuration errors" export.log \
              | head -n 7 | while IFS= read -r line; do echo "::error::$line"; done
            grep -nE "Missing|missing|not configured|Invalid|Unable" export.log \
              | tail -n 3 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          ls -lh build
          python3 - <<'PY'
          import zipfile
          p = "build/sudan-runner.apk"
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              libs = [n for n in names if n.startswith("lib/")]
              print("APK entries:", len(names))
              print("native libs:", libs)
              assert any("arm64" in n for n in libs), "arm64-v8a native library missing"
              assert any("armeabi" in n for n in libs), "armeabi-v7a native library missing"
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudan-runner-apk
          path: build/sudan-runner.apk
          if-no-files-found: error

      - name: Publish rolling "latest-build" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-build >/dev/null 2>&1 || \
            gh release create latest-build --latest --target "$GITHUB_SHA" \
              --title "Latest build (auto)" \
              --notes "Automatically built APK from the latest commit. Download sudan-runner.apk below and install it on any Android 7+ phone (allow install from unknown sources)."
          gh release upload latest-build build/sudan-runner.apk --clobber
          gh release edit latest-build --target "$GITHUB_SHA"

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "Sudan Runner ${GITHUB_REF_NAME}" \
              --notes "Android build of Sudan Runner (Gadaman). Install the APK on any Android 7+ phone."
          gh release upload "${GITHUB_REF_NAME}" build/sudan-runner.apk --clobber

  # ---------------------------------------------------------------------------
  # 3. Render real screenshots on a software GL stack (manual trigger).
  #    Used to visually review the procedural art without a physical device.
  # ---------------------------------------------------------------------------
  screenshots:
    name: Capture screenshots
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.capture_screenshots) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[shots]'))
    runs-on: ubuntu-latest
    # No `needs: validate` on purpose: this job builds + verifies the hero
    # itself, so a red validate job must not hide the visual evidence.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install software GL + X virtual framebuffer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglx-mesa0 libglu1-mesa mesa-utils
          echo "--- glxinfo ---"
          xvfb-run -a glxinfo -B 2>&1 | head -n 12 || true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --import 2>&1 | tail -n 5

      - name: Build + verify hero (screenshots must show the real runner)
        run: |
          # Without this step the screenshot job renders the procedural fallback,
          # which is why the v1.2.x screenshots looked fine while the APK showed
          # no character at all.
          set -o pipefail
          timeout 240 godot --headless --script tools/ci_build_hero.gd 2>&1 \
            | tee hero_build.log | tail -n 60 || true
          cat assets/models/hero/hero_report.txt 2>/dev/null || true
          timeout 120 godot --headless --script tools/ci_verify_hero.gd 2>&1 \
            | tee hero_verify.log | tail -n 40 || true
          grep -E "\[CIVerifyHero\]" hero_verify.log | tail -n 5 || true
          timeout 120 godot --headless --script tools/ci_hero_probe.gd 2>&1 \
            | tee hero_probe.log | tail -n 40 || true
          mkdir -p docs
          cp assets/models/hero/hero_report.txt docs/hero_report.txt 2>/dev/null || true
          cp hero_probe.log docs/hero_runtime.txt 2>/dev/null || true
          # Small slice of the generated scene for debugging serialization.
          {
            echo "== AnimationPlayer block =="
            grep -n -A 6 'type="AnimationPlayer"' assets/models/hero/hero.tscn | head -n 20 || true
            echo "== AnimationTree nodes (should be none) =="
            grep -n 'type="AnimationTree"' assets/models/hero/hero.tscn | head -n 5 || true
            echo "== first clip tracks =="
            grep -n 'tracks/[0-9]*/path' assets/models/hero/hero.tscn | head -n 6 || true
            echo "== sub_resources: $(grep -c '^\[sub_resource' assets/models/hero/hero.tscn || true)"
            echo "== ext_resources =="
            grep -n '^\[ext_resource' assets/models/hero/hero.tscn | head -n 10 || true
            echo "== nodes =="
            grep -n '^\[node' assets/models/hero/hero.tscn | head -n 20 || true
          } > docs/hero_scene.txt

      - name: Render screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
        run: |
          set -o pipefail
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --rendering-driver opengl3 --resolution 1280x720 -- --screenshot 2>&1 | tee shots.log || true
          # Annotations instead of plain log lines: the raw logs are served from
          # blob storage that some environments cannot reach.
          grep -aE "SHOT|SCREENSHOTS_DONE|Warmup|SCRIPT ERROR|Parse Error|ERROR:" shots.log \
            | tail -n 25 | while IFS= read -r line; do echo "::notice title=shots::${line}"; done
          if ! grep -q "SCREENSHOTS_DONE" shots.log; then
            grep -aE "SCRIPT ERROR|Parse Error|ERROR:|Cannot|Invalid" shots.log | head -n 10 \
              | while IFS= read -r line; do echo "::error title=shots::${line}"; done
            echo "::error::screenshot session did not reach SCREENSHOTS_DONE"
          fi
          mkdir -p docs/screenshots
          USER_DIR="$HOME/.local/share/godot/app_userdata/Sudan Runner"
          ls -la "$USER_DIR" || true
          cp "$USER_DIR"/shot_*.png docs/screenshots/ 2>/dev/null || true
          cp "$USER_DIR"/hero_state.txt docs/hero_state.txt 2>/dev/null || true
          echo "--- hero_state (runtime truth) ---"
          cat docs/hero_state.txt 2>/dev/null || echo "(no hero_state.txt)"
          ls -la docs/screenshots

      - name: Commit screenshots to the branch
        run: |
          if ! ls docs/screenshots/shot_*.png >/dev/null 2>&1; then
            echo "::warning::No screenshots were rendered."
            exit 0
          fi
          git config user.name "Sudan Runner CI"
          git config user.email "ci@users.noreply.github.com"
          git add docs/screenshots/*.png
          if [ -f docs/hero_report.txt ]; then
            git add docs/hero_report.txt
          fi
          if [ -f docs/hero_runtime.txt ]; then
            git add docs/hero_runtime.txt
          fi
          if [ -f docs/hero_scene.txt ]; then
            git add docs/hero_scene.txt
          fi
          if [ -f docs/hero_state.txt ]; then
            git add docs/hero_state.txt
          fi
          if [ -f hero_build.log ]; then
            cp hero_build.log docs/hero_build.txt
            git add docs/hero_build.txt
          fi
          git commit -m "docs: automated gameplay screenshots"
          git push origin "HEAD:${{ github.ref_name }}"
